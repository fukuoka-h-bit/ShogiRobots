function playLaserEffect(fromR, fromC, toR, toC, isHeavy = false) {
    const laserSvg = document.getElementById('laser-svg');
    const boardEl = document.getElementById('board');
    if (!laserSvg || !boardEl) return;
    const boardRect = boardEl.getBoundingClientRect();
    const cellWidth = boardRect.width / 9, cellHeight = boardRect.height / 9;
    const x1 = fromC * cellWidth + cellWidth / 2, y1 = fromR * cellHeight + cellHeight / 2;
    const x2 = toC * cellWidth + cellWidth / 2, y2 = toR * cellHeight + cellHeight / 2;

    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", x1); line.setAttribute("y1", y1); line.setAttribute("x2", x2); line.setAttribute("y2", y2);
    line.setAttribute("stroke-width", isHeavy ? "14" : "7");
    line.setAttribute("class", `laser-line ${isHeavy ? 'heavy' : ''}`);
    laserSvg.appendChild(line);
    playSE('beam');
    setTimeout(() => { laserSvg.innerHTML = ''; }, 350);
}

function playSaberSlashEffect(targetR, targetC) {
    const laserSvg = document.getElementById('laser-svg');
    const boardEl = document.getElementById('board');
    if (!laserSvg || !boardEl) return;
    laserSvg.innerHTML = '';
    const boardRect = boardEl.getBoundingClientRect();
    const cellWidth = boardRect.width / 9, cellHeight = boardRect.height / 9;

    const centerX = targetC * cellWidth + cellWidth / 2;
    const centerY = targetR * cellHeight + cellHeight / 2;

    const x1 = centerX - cellWidth * 0.35;
    const y1 = centerY - cellHeight * 0.35;
    const x2 = centerX + cellWidth * 0.35;
    const y2 = centerY + cellHeight * 0.35;

    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", x1); line.setAttribute("y1", y1);
    line.setAttribute("x2", x2); line.setAttribute("y2", y2);
    line.setAttribute("stroke-width", "8"); line.setAttribute("class", "saber-line");
    laserSvg.appendChild(line);
    playSE('slash');
    setTimeout(() => { laserSvg.innerHTML = ''; }, 350);
}

function playCutinEffect(pieceName, type = 'normal', callback = null) {
    const cutinOverlay = document.getElementById('cutin-overlay');
    const cutinText = document.getElementById('cutin-text');
    if (!cutinOverlay || !cutinText) { if (callback) callback(); return; }
    cutinText.innerText = pieceName; cutinText.className = '';
    if (type === 'check') cutinText.classList.add('check-text');
    else if (type === 'daho') cutinText.classList.add('daho-text');
    cutinOverlay.style.display = 'flex';
    playSE('cutin');
    setTimeout(() => { cutinOverlay.style.display = 'none'; if (callback) callback(); }, 450);
}

function renderCaptured() {
    [1, 2].forEach(p => {
        const listEl = document.getElementById(`cap-list-${p}`);
        const labelEl = document.getElementById(`cap-label-${p}`);
        if (!listEl || !labelEl) return;
        listEl.innerHTML = '';
        let pLabel = "";
        if (gameMode === 'cvc') {
            pLabel = (p === 1) ? `🟦 ${cvcBrain1PName}` : `🟨 ${cvcBrain2PName}`;
        } else {
            pLabel = (p === 1) ? "1P持ち駒" : ((gameMode === 'boss' || gameMode === 'pve') ? "敵持ち駒" : "2P持ち駒");
        }
        labelEl.innerText = pLabel;
        let counts = {};
        captured[p].forEach(type => { counts[type] = (counts[type] || 0) + 1; });

        Object.keys(counts).forEach(type => {
            const count = counts[type];
            const origIndex = captured[p].indexOf(type);
            const item = document.createElement('div');
            item.className = 'cap-item';
            if (isHorseDockingMode && turn === p) item.classList.add('selectable-dock');
            else if (selectedCapIndex === origIndex && turn === p) item.classList.add('selected-cap');

            let dummyPiece = { t: type, p: p, promoted: false };
            item.innerHTML = createPieceHTML(dummyPiece);

            if (count > 1) {
                const countBadge = document.createElement('div');
                countBadge.className = 'count-badge'; countBadge.innerText = `×${count}`;
                item.appendChild(countBadge);
            }

            item.onclick = (e) => {
                e.stopPropagation();
                if (isProcessingTurn || ((gameMode === 'pve' || gameMode === 'boss') && turn === 2)) return;
                if (turn === p) {
                    playSE('select');
                    if (isHorseDockingMode) executeHorseDocking(origIndex);
                    else selectCapturedPiece(origIndex);
                }
            };
            listEl.appendChild(item);
        });
    });
}

function hasPawnInColumn(player, col) {
    for (let r = 0; r < 9; r++) {
        let p = boardState[r] ? boardState[r][col] : null;
        if (p && p.p === player && p.t === 'FU' && !p.promoted) return true;
    }
    return false;
}

function isInvalidDropPosition(player, pieceType, r) {
    if (player === 1) {
        if ((pieceType === 'FU' || pieceType === 'KY') && r === 0) return true;
        if (pieceType === 'KE' && (r === 0 || r === 1)) return true;
    } else {
        if ((pieceType === 'FU' || pieceType === 'KY') && r === 8) return true;
        if (pieceType === 'KE' && (r === 8 || r === 7)) return true;
    }
    return false;
}

function selectCapturedPiece(idx) {
    if (isHorseDockingMode || isProcessingTurn) return;
    selected = null; selectedCapIndex = idx; actionMode = 'drop'; isSpecialReady = false;
    let spDescBox = document.getElementById('sp-desc-box');
    if (spDescBox) spDescBox.style.display = 'none';
    const pieceType = captured[turn][idx];
    targets = [];
    for(let r=0; r<9; r++){
        for(let c=0; c<9; c++){
            if(!boardState[r][c]) {
                let isBlocked = false;
                if (pieceType === 'FU' && hasPawnInColumn(turn, c)) isBlocked = true;
                if (isInvalidDropPosition(turn, pieceType, r)) isBlocked = true;
                targets.push({ r, c, blocked: isBlocked });
            }
        }
    }
    let infoEl = document.getElementById('info-panel');
    if (infoEl) infoEl.innerText = `持ち駒【${PIECE_TYPES[pieceType].name}】を召喚する空きマスを選んでください。`;
    renderBoard();
}

function playHitEffect(r, c) {
    const cell = document.getElementById(`cell-${r}-${c}`);
    if (cell) {
        const effect = document.createElement('div');
        effect.className = 'hit-effect';
        cell.appendChild(effect);
        setTimeout(() => effect.remove(), 300);
    }
}

function playMissEffect(r, c) {
    const cell = document.getElementById(`cell-${r}-${c}`);
    if (cell) {
        const effect = document.createElement('div');
        effect.className = 'miss-effect'; effect.innerText = "MISS";
        cell.appendChild(effect);
        setTimeout(() => effect.remove(), 500);
    }
}

function clickSpecialButton(spType = 'shield') {
    if (!selected || isProcessingTurn) return;
    const actor = boardState[selected.r][selected.c];
    selectedSpecialType = spType;

    if (actor.t === 'KA' && actor.promoted) {
        if (captured[turn].length === 0) {
            let infoEl = document.getElementById('info-panel');
            if (infoEl) infoEl.innerText = "❌ 持ち駒がないため合体（必殺技）できません！";
            return;
        }
        playSE('special');
        startHorseDockingMode(actor);
        return;
    }

    if (!isSpecialReady) {
        calculateTargets(selected, 'special');
        let validTargets = targets.filter(t => !t.blocked);
        let isDirectExecPiece = (actor.t === 'KI' && spType === 'shield') || actor.t === 'SOLDIER' || actor.t === 'HI' || actor.t === 'OU';

        if (!isDirectExecPiece && validTargets.length === 0) {
            let infoEl = document.getElementById('info-panel');
            if (infoEl) infoEl.innerText = "❌ 範囲内に必殺技を実行できる対象がいません！";
            return;
        }

        playSE('special');
        actionMode = 'special'; isSpecialReady = true;
        let btnAttack = document.getElementById('btn-attack');
        let spBtn = document.getElementById('btn-special');
        let spearBtn = document.getElementById('btn-spear');
        let infoEl = document.getElementById('info-panel');

        if (isDirectExecPiece) {
            if (btnAttack) btnAttack.disabled = true;
            if (spBtn) { spBtn.className = 'sp-btn ready-exec'; spBtn.innerText = `⚡ 発動する（要確認）`; }
            if (spearBtn) spearBtn.disabled = true;
            if (infoEl) infoEl.innerText = `『発動する』ボタンを押して必殺技を起動してください！`;
        } else {
            if (btnAttack) btnAttack.disabled = true;
            if (spBtn) { spBtn.disabled = true; spBtn.className = 'sp-btn'; spBtn.innerText = `🔥 マスを選択中...`; }
            if (spearBtn) spearBtn.disabled = true;

            if (infoEl) {
                if (actor.t === 'KY') infoEl.innerText = `【盤上の紫色の移動マスをクリックして即発動！】`;
                else if (actor.t === 'KI' && spType === 'spear') infoEl.innerText = `【アルティメットスピア: 攻撃対象を選択して一撃貫通！】`;
                else infoEl.innerText = `【盤上の紫色の対象をクリックして即発動！】`;
            }
        }

        let spNameStr = (actor.t === 'KI' && selectedSpecialType === 'spear') ? PIECE_TYPES.KI.spName2 : PIECE_TYPES[actor.t].spName;
        let spDescBox = document.getElementById('sp-desc-box');
        if (spDescBox) {
            spDescBox.innerHTML = `<strong>【${spNameStr}】</strong><br>${PIECE_TYPES[actor.t].desc}`;
            spDescBox.style.display = 'block';
        }
        renderBoard();
    } else executeSpecialAction();
}

function startHorseDockingMode(actor) {
    isHorseDockingMode = true;
    let boardOverlay = document.getElementById('board-overlay');
    let spDescBox = document.getElementById('sp-desc-box');
    let infoEl = document.getElementById('info-panel');
    if (boardOverlay) boardOverlay.style.display = 'flex';
    if (spDescBox) { spDescBox.innerHTML = DOCKING_GUIDE_TEXT; spDescBox.style.display = 'block'; }
    if (infoEl) infoEl.innerText = "【どの持ち駒を選びますか？】持ち駒をクリックしてください（解除ボタンでキャンセル）";
    renderBoard();
}

function executeHorseDocking(capIndex) {
    if (isProcessingTurn) return;
    isProcessingTurn = true;
    const actor = boardState[selected.r][selected.c];
    const capPieceType = captured[turn][capIndex];
    const capPieceName = PIECE_TYPES[capPieceType].name;
    
    captured[turn].splice(capIndex, 1);
    actor.mountedPiece = capPieceType; actor.spUsed = true; actor.dockTimer = 5; // 🐎 5手時限カウント設定
    lastMoveTo = { r: selected.r, c: selected.c };
    
    playCutinEffect(PIECE_TYPES[actor.t].spName, 'normal', () => {
        playHitEffect(selected.r, selected.c);
        playSE('special');
        addLog(turn, `馬が【${capPieceName}】と合体！(残り5手)`);
        let infoEl = document.getElementById('info-panel');
        if (infoEl) infoEl.innerText = `【${PIECE_TYPES.KA.spName}】${capPieceName}と合体完了！固有パターンへ覚醒！`;
        isProcessingTurn = false; isHorseDockingMode = false;
        let boardOverlay = document.getElementById('board-overlay');
        if (boardOverlay) boardOverlay.style.display = 'none';

        // 🎯【ここを追加！】合体データが入ったので盤面を再描画して画像を変身させる！
        renderBoard();

        setTimeout(endTurn, 300);
    });
}

function executeSpecialAction(targetCell = null) {
    if (isProcessingTurn) return;
    isProcessingTurn = true;
    const actor = boardState[selected.r][selected.c];
    
    let spText = (actor.t === 'KI' && selectedSpecialType === 'spear') ? PIECE_TYPES.KI.spName2 : PIECE_TYPES[actor.t].spName;

    playCutinEffect(spText, 'normal', () => {
        if (targetCell) executeSpecial(actor, targetCell.r, targetCell.c);
        else {
            targets.filter(t => !t.blocked).forEach(t => playHitEffect(t.r, t.c));
            executeSpecial(actor, selected.r, selected.c);
        }
    });
}

function checkItemDrop() {
    if (totalTurnsCount > 0 && totalTurnsCount % 30 === 0) {
        let emptyCells = [];
        for(let r=0; r<9; r++){
            for(let c=0; c<9; c++){
                if(!boardState[r][c] && !itemState.some(it => it.r === r && it.c === c)) emptyCells.push({r, c});
            }
        }
        if (emptyCells.length > 0) {
            let randCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            itemState.push(randCell);
            playSE('special');
            addLog(1, `💊物資補給！マス[${randCell.r+1},${randCell.c+1}]に回復カプセルが届いた！`);
            let infoEl = document.getElementById('info-panel');
            if (infoEl) infoEl.innerText = `💊物資ドロップ！回復カプセルが出現しました！`;
        }
    }
}

function checkPickupItem(r, c, piece) {
    let itemIdx = itemState.findIndex(it => it.r === r && it.c === c);
    if (itemIdx !== -1) {
        itemState.splice(itemIdx, 1);
        let maxHp = PIECE_TYPES[piece.t].hp;
        if (piece.hp < maxHp) {
            piece.hp += 1; playSE('heal');
            addLog(piece.p, `${PIECE_TYPES[piece.t].name}が回復カプセル💊を獲得！HPが1回復！`);
        } else {
            playSE('select');
            addLog(piece.p, `${PIECE_TYPES[piece.t].name}がカプセル💊を回収・除去した！`);
        }

        // 👍【追加】CPU（2P）が回復カプセルを獲得した時のプラス学習！
        if (piece.p === 2) {
            learnSuccessPattern(piece.t, r, c, 250, "get_item");
        }
    }
}

function handleCellClick(r, c) {
    if (isHorseDockingMode || isProcessingTurn) return;
    const piece = boardState[r] ? boardState[r][c] : null;

    if (piece && piece.p !== turn) {
        let nameStr = piece.promoted ? PIECE_TYPES[piece.t].pName : PIECE_TYPES[piece.t].name;
        let spStatus = piece.spUsed ? "【必殺技: 使用済み ❌】" : "【必殺技: 未使用 🔥】";
        let infoEl = document.getElementById('info-panel');
        if (infoEl) infoEl.innerText = `敵機【${nameStr}】 (HP:${piece.hp}) ${spStatus}`;
    }

    if ((gameMode === 'pve' || gameMode === 'boss') && turn === 2) return;

    if (actionMode === 'drop' && selectedCapIndex !== null) {
        const target = targets.find(t => t.r === r && t.c === c);
        if (target) {
            if (target.blocked) {
                let infoEl = document.getElementById('info-panel');
                if (infoEl) infoEl.innerText = "❌ 反則（二歩、または移動不能位置）のためここには打てません！";
                return;
            }
            isProcessingTurn = true; playSE('select');
            const pieceType = captured[turn].splice(selectedCapIndex, 1)[0];
            let newPiece = { t: pieceType, p: turn, hp: PIECE_TYPES[pieceType].hp, promoted: false, spUsed: false, shield: 0, mountedPiece: null, isCharging: false };
            boardState[r][c] = newPiece;
            checkPickupItem(r, c, newPiece);
            lastMoveTo = { r, c };
            addLog(turn, `${turn === 1 ? '1P' : '2P'}が持ち駒【${PIECE_TYPES[pieceType].name}】を召喚！`);
            let infoEl = document.getElementById('info-panel');
            if (infoEl) infoEl.innerText = `持ち駒【${PIECE_TYPES[pieceType].name}】を召喚しました！`;
            endTurn();
        }
        return;
    }

if (!selected || (piece && piece.p === turn && actionMode !== 'attack' && actionMode !== 'special')) {
        if (piece && piece.p === turn) {
            // ⚠️【追加】王手警告チェック＆回避可能性の検証
            const checkedKings = checkKingsUnderAttack();
            const isSelfChecked = checkedKings.some(pos => {
                let k = boardState[pos.r] ? boardState[pos.r][pos.c] : null;
                return k && k.p === turn && k.hp === 1; // 👈 hp === 1 を追加
            });

            if (isSelfChecked) {
                // 王手中にこの駒を動かして「王手が解除できるか」を全シミュレーション
                let canEscapeCheck = false;
                let testOrigin = { r, c };
                let testMoves = calculateTargetsPure(testOrigin, 'move');
                let testAttacks = calculateTargetsPure(testOrigin, 'attack');
                let testAll = [...testMoves, ...testAttacks].filter(m => !m.blocked);

                for (let m of testAll) {
                    let savedTarget = boardState[m.r][m.c];
                    boardState[m.r][m.c] = piece; boardState[r][c] = null;
                    
                    // 仮移動後に自分の王手が消えたか？
                    let newKingR = (piece.t === 'OU' || piece.t === 'BOSS') ? m.r : -1;
                    let newKingC = (piece.t === 'OU' || piece.t === 'BOSS') ? m.c : -1;
                    if (newKingR === -1) {
                        // 玉以外の駒を動かした場合は、玉の現在位置を探す
                        for (let kr = 0; kr < 9; kr++) {
                            for (let kc = 0; kc < 9; kc++) {
                                let kp = boardState[kr] ? boardState[kr][kc] : null;
                                if (kp && kp.p === turn && (kp.t === 'OU' || kp.t === 'BOSS')) {
                                    newKingR = kr; newKingC = kc;
                                }
                            }
                        }
                    }

                    let stillChecked = isTileAttackedByEnemy(newKingR, newKingC, turn);
                    boardState[r][c] = piece; boardState[m.r][m.c] = savedTarget; // 盤面を戻す

                    if (!stillChecked) {
                        canEscapeCheck = true;
                        break;
                    }
                }

                // 王手を回避できない無関係な駒なら弾く！
                if (!canEscapeCheck) {
                    playSE('miss');
                    let infoEl = document.getElementById('info-panel');
                    if (infoEl) infoEl.innerText = "⚠️【王手警報】その駒では王手を解除できません！玉の避難か防御を行ってください！";
                    return;
                }
            }

            // ⭕ 王手を解除できる駒（または通常時）なら選択を許可！
            playSE('select'); selectedCapIndex = null; selected = { r, c }; actionMode = 'move'; isSpecialReady = false;
            let spDescBox = document.getElementById('sp-desc-box');
            if (spDescBox) spDescBox.style.display = 'none';
            let btnAttack = document.getElementById('btn-attack');
            if (btnAttack) btnAttack.disabled = false;

            let canUseSpecial = false;
            if (piece.t === 'KI' || piece.t === 'SOLDIER' || piece.t === 'SHOGUN') canUseSpecial = !piece.spUsed;
            else if (piece.t === 'OU') canUseSpecial = !piece.spUsed;
            else if (piece.t === 'HI') canUseSpecial = (piece.promoted && !piece.spUsed);
            else if (piece.t === 'KA') canUseSpecial = (piece.promoted && !piece.spUsed && captured[turn].length > 0);
            else canUseSpecial = (piece.promoted && !piece.spUsed);

            let spBtn = document.getElementById('btn-special');
            let spearBtn = document.getElementById('btn-spear');

            if (piece.t === 'KI') {
                if (spBtn) { spBtn.style.display = 'inline-block'; spBtn.disabled = !canUseSpecial; spBtn.className = 'sp-btn'; spBtn.innerText = `🛡️ シールド` + (piece.spUsed ? "(済)" : ""); }
                if (spearBtn) { spearBtn.style.display = 'inline-block'; spearBtn.disabled = !canUseSpecial; spearBtn.className = 'sp-btn'; spearBtn.innerText = `🗡️ スピア` + (piece.spUsed ? "(済)" : ""); }
            } else {
                if (spBtn) { spBtn.style.display = 'inline-block'; spBtn.disabled = !canUseSpecial; spBtn.className = 'sp-btn'; spBtn.innerText = `🔥 ${PIECE_TYPES[piece.t].spName}` + (piece.spUsed ? " (済)" : ""); }
                if (spearBtn) spearBtn.style.display = 'none';
            }

            let spStatusSelf = piece.spUsed ? "【必殺技: 済】" : "【必殺技: 未使用】";
            let infoEl = document.getElementById('info-panel');
            if (infoEl) infoEl.innerText = `【${piece.promoted ? PIECE_TYPES[piece.t].pName : PIECE_TYPES[piece.t].name}】選択中 ${spStatusSelf}`;
            calculateTargets(selected, 'move');
            renderBoard();
        }
        return;
    }

    if (actionMode === 'special') {
        const actor = boardState[selected.r][selected.c];
        if (actor.t === 'FU' || actor.t === 'KE' || actor.t === 'GI' || actor.t === 'KY' || (actor.t === 'KI' && selectedSpecialType === 'spear')) {
            const target = targets.find(t => t.r === r && t.c === c);
            if (target && !target.blocked) executeSpecialAction({ r, c });
        }
        return;
    }

    const target = targets.find(t => t.r === r && t.c === c);
    if (target) {
        if (target.blocked) {
            let infoEl = document.getElementById('info-panel');
            if (infoEl) infoEl.innerText = "❌ 障害物または射線上のため実行できません！";
            return;
        }

        const actor = boardState[selected.r][selected.c];

        if (actionMode === 'move') {
            isProcessingTurn = true; playSE('select');
            let fromR = selected.r, fromC = selected.c;
            lastMoveTo = { r, c };
            const actorName = actor.promoted ? PIECE_TYPES[actor.t].pName : PIECE_TYPES[actor.t].name;
            
            animatePieceMove(fromR, fromC, r, c, false, () => {
                boardState[r][c] = actor; boardState[fromR][fromC] = null;
                checkPickupItem(r, c, actor);
                let promotedMsg = checkPromotion(fromR, r, actor);
                addLog(turn, `${actorName}が移動。${promotedMsg}`);
                endTurn();
            });
        } 
        else if (actionMode === 'attack') {
            isProcessingTurn = true;
            const targetPiece = boardState[r] ? boardState[r][c] : null;
            let willCapture = (targetPiece && targetPiece.hp <= ((actor.mountedPiece && target.isHeavy) ? 2 : 1));
            let dist = Math.max(Math.abs(r - selected.r), Math.abs(c - selected.c));
            let isRangedAttack = (dist >= 2 && (actor.t === 'HI' || actor.t === 'KA' || actor.t === 'KY'));

            if (willCapture) {
                animatePieceMove(selected.r, selected.c, r, c, true, () => {
                    playSaberSlashEffect(r, c); playHitEffect(r, c);
                    executeAttack(actor, r, c, false, target.isHeavy);
                    setTimeout(endTurn, 350);
                });
            } else {
                if (isRangedAttack) {
                    playLaserEffect(selected.r, selected.c, r, c, target.isHeavy);
                    if (target.isHeavy) playSE('heavy_hit'); else playSE('hit');
                    playHitEffect(r, c);
                    executeAttack(actor, r, c, false, target.isHeavy);
                    setTimeout(endTurn, 350);
                } else {
                    playSaberSlashEffect(r, c); playHitEffect(r, c);
                    if (target.isHeavy) playSE('heavy_hit'); else playSE('hit');
                    executeAttack(actor, r, c, false, target.isHeavy);
                    setTimeout(endTurn, 350);
                }
            }
        }
    }
}

function checkPromotion(fromR, toR, piece) {
    if (!piece.promoted && piece.t !== 'KI' && piece.t !== 'SOLDIER' && piece.t !== 'SHOGUN' && piece.t !== 'BOSS') {
        const isEnemyZone = (p, r) => (p === 1 && r <= 2) || (p === 2 && r >= 6);
        if (isEnemyZone(piece.p, fromR) || isEnemyZone(piece.p, toR)) {
            let doPromote = true;
            // 🎯【修正】CvCモードの時は確認ポップアップを出さずに自動で成る！
            if ((turn === 1 && gameMode !== 'cvc') || (turn === 2 && gameMode === 'pvp')) {
                doPromote = confirm("成りますか？（キャンセルでそのまま）");
            }
            if (doPromote) {
                playSE('special'); piece.promoted = true;
                let infoEl = document.getElementById('info-panel');
                if (infoEl) infoEl.innerText += " 成りました！必殺技解放！";
                return "成りました！";
            } else return "成らず。";
        }
    }
    return "";
}

function checkGameOver(targetPiece) {
    if (targetPiece.t === 'BOSS') {
        setTimeout(() => { alert(`🎉 撃破！【破滅的大王】を討伐しました！プレイヤーの完全勝利！`); initGame(); }, 100);
        return true;
    }
    if (targetPiece.t === 'OU') {
        setTimeout(() => { alert(`【${targetPiece.p === 1 ? (gameMode === 'pve' ? 'CPU' : '2P') : '1P'}】の勝利！`); initGame(); }, 100);
        return true;
    }
    return false;
}

function executeAttack(actor, tr, tc, isSpecial, isHeavy = false, isSpearBypass = false) {
    const targetPiece = boardState[tr] ? boardState[tr][tc] : null;
    if (!targetPiece) return;

    const actorName = actor.promoted ? PIECE_TYPES[actor.t].pName : PIECE_TYPES[actor.t].name;
    const targetName = targetPiece.promoted ? PIECE_TYPES[targetPiece.t].pName : PIECE_TYPES[targetPiece.t].name;

    if (targetPiece.shield > 0 && !isSpearBypass) {
        addLog(turn, `${actorName}の攻撃！${targetName}のシールドに防がれた！`);
        let infoEl = document.getElementById('info-panel');
        if (infoEl) infoEl.innerText = "🛡️ シールドにより攻撃を防がれた！";
        return;
    }

    let dmg = (isSpearBypass) ? 1 : ((actor.t === 'KA' && actor.mountedPiece === 'HI') ? 1 : (isHeavy ? 2 : 1));
    let skillName = isSpecial ? (isSpearBypass ? "アルティメットスピア" : PIECE_TYPES[actor.t].spName) : (dmg === 2 ? "強撃(ダメージ2)" : "攻撃");

// 👎 1Pが2Pの駒を取った時のマイナス学習
    if (targetPiece.p === 2) learnFromCapture(targetPiece, tr, tc, actor);

    // 👍【追加】2P（CPU）が1Pの駒にダメージを与えた・拿捕した時のプラス学習！
    if (actor.p === 2 && targetPiece.p === 1) {
        let bonusVal = (PIECE_VALUES[targetPiece.t] || 200);
    // 💥 必殺技での攻撃ならボーナス点（+150）を上乗せ！
        if (isSpecial) {
            bonusVal += 150;
        }

        learnSuccessPattern(actor.t, tr, tc, bonusVal, isSpecial ? "special_attack" : "attack");
    }

    targetPiece.hp -= dmg;
    lastMoveTo = { r: tr, c: tc };
    let dist = Math.max(Math.abs(tr - (selected ? selected.r : tr)), Math.abs(tc - (selected ? selected.c : tc)));

    if (targetPiece.hp <= 0) {
        let fromR = selected ? selected.r : tr;
        if (checkGameOver(targetPiece)) return;
        
        if (targetPiece.p === actor.p) {
            let enemyPlayer = actor.p === 1 ? 2 : 1;
            let capType = (targetPiece.t === 'SOLDIER' || targetPiece.t === 'SHOGUN') ? 'KI' : targetPiece.t;
            captured[enemyPlayer].push(capType);
            if (targetPiece.mountedPiece) captured[enemyPlayer].push(targetPiece.mountedPiece);

            addLog(turn, `激怒！誤射された${targetName}がむかついて敵に寝返った！`);
            let infoEl = document.getElementById('info-panel');
            if (infoEl) infoEl.innerText = `誤射！【${targetName}】が裏切って相手の持ち駒になりました！`;
            boardState[tr][tc] = null;
        } else {
            if (actor.t === 'BOSS') {
                addLog(2, `大王の攻撃！${targetName}は消滅した…（持ち駒不可）`);
                let infoEl = document.getElementById('info-panel');
                if (infoEl) infoEl.innerText = `大王の恐怖！【${targetName}】は永久に消滅した…！`;
                boardState[tr][tc] = null;
            } else if ((actor.t === 'HI' || actor.t === 'FU') && isSpecial) {
                addLog(turn, `${actorName}の${skillName}！${targetName}を撃破！`);
                let capType = (targetPiece.t === 'SOLDIER' || targetPiece.t === 'SHOGUN') ? 'KI' : targetPiece.t;
                captured[actor.p].push(capType);
                if (targetPiece.mountedPiece) captured[actor.p].push(targetPiece.mountedPiece);
                boardState[tr][tc] = null;
                let infoEl = document.getElementById('info-panel');
                if (infoEl) infoEl.innerText = `${actorName}の遠距離射撃！${targetName}を遠距離消滅させた！`;
            } else if (actor.t === 'KA' && actor.mountedPiece === 'HI' && dist >= 2) {
                // 🐎 クイーンの長距離砲撃
                if (targetPiece.hp <= 0) {
                    // ⚔️ HPが0になった（トドメ）なら、相手のマスへ踏み込んで拿捕！
                    addLog(turn, `${actorName}のオールレンジ攻撃！${targetName}を撃破して拿捕！`);
                    let capType = (targetPiece.t === 'SOLDIER' || targetPiece.t === 'SHOGUN') ? 'KI' : targetPiece.t;
                    captured[actor.p].push(capType);
                    if (targetPiece.mountedPiece) captured[actor.p].push(targetPiece.mountedPiece);
                    
                    boardState[tr][tc] = actor;
                    if (selected) boardState[selected.r][selected.c] = null;
                    
                    playCutinEffect("拿捕！", 'daho', () => {
                        renderBoard(); playSE('stomp');
                        const destCell = document.getElementById(`cell-${tr}-${tc}`);
                        if (destCell) {
                            const pEl = destCell.querySelector('.piece');
                            if (pEl) {
                                pEl.classList.add('stomp-animation');
                                setTimeout(() => pEl.classList.remove('stomp-animation'), 400);
                            }
                        }
                    });

                    checkPickupItem(tr, tc, actor);
                    checkPromotion(fromR, tr, actor);
                    let infoEl = document.getElementById('info-panel');
                    if (infoEl) infoEl.innerText = `${actorName}が【${targetName}】を拿捕して前進！`;
                } else {
                    // 💥 まだHPが残っているなら、その場でビーム（移動なし）
                    addLog(turn, `${actorName}のオールレンジ狙撃！${targetName}に1ダメージ！`);
                    let infoEl = document.getElementById('info-panel');
                    if (infoEl) infoEl.innerText = `${actorName}の長距離砲撃！${targetName}へ遠距離ビーム！`;
                    renderBoard();
                }
            } else {
                // ⚔️ 通常の近接・その他撃破処理
                addLog(turn, `${actorName}の${skillName}！${targetName}を拿捕（撃破）！`);
                let capType = (targetPiece.t === 'SOLDIER' || targetPiece.t === 'SHOGUN') ? 'KI' : targetPiece.t;
                captured[actor.p].push(capType);
                if (targetPiece.mountedPiece) captured[actor.p].push(targetPiece.mountedPiece);
                
                boardState[tr][tc] = actor;
                if (selected) boardState[selected.r][selected.c] = null;
                
                playCutinEffect("拿捕！", 'daho', () => {
                    renderBoard(); playSE('stomp');
                    const destCell = document.getElementById(`cell-${tr}-${tc}`);
                    if (destCell) {
                        const pEl = destCell.querySelector('.piece');
                        if (pEl) {
                            pEl.classList.add('stomp-animation');
                            setTimeout(() => pEl.classList.remove('stomp-animation'), 400);
                        }
                    }
                });

                checkPickupItem(tr, tc, actor);
                checkPromotion(fromR, tr, actor);
                let infoEl = document.getElementById('info-panel');
                if (infoEl) infoEl.innerText = `${actorName}が【${targetName}】を拿捕して前進！`;
            }
        }
    } else {
        addLog(turn, `${actorName}の${skillName}！${targetName}に${dmg}のダメージ！`);
        let infoEl = document.getElementById('info-panel');
        if (infoEl) infoEl.innerText = `攻撃命中！【${targetName}】に${dmg}ダメージ！`;
        renderBoard();
    }
}

// 🐉 飛車のメガ粒子砲（自動発射・ダメージ判定完全復旧）
function executeRyuMegaParticleBeam(r, c, actor) {
    playSE('beam');
    let directions = [[-1,0],[1,0],[0,-1],[0,1]]; // 上・下・左・右
    
    // 1. 極太レーザー演出
    directions.forEach(d => {
        let farR = Math.max(0, Math.min(8, r + d[0] * 8));
        let farC = Math.max(0, Math.min(8, c + d[1] * 8));
        playLaserEffect(r, c, farR, farC, true);
    });

    // 2. 💥 上下左右の列にいる者【全員（敵も味方も）】に貫通ダメージ！
    directions.forEach(d => {
        for (let step = 1; step <= 8; step++) {
            let tr = r + d[0] * step;
            let tc = c + d[1] * step;
            if (tr < 0 || tr >= 9 || tc < 0 || tc >= 9) break;

            let p = boardState[tr] ? boardState[tr][tc] : null;
            if (p) {
                playHitEffect(tr, tc);
                if (p.shield > 0) {
                    addLog(actor.p, `メガ粒子砲！${PIECE_TYPES[p.t].name}のシールドに阻まれた！`);
                } else {
                    if (p.p === 2) learnFromCapture(p, tr, tc, actor);
                    p.hp -= 1;
                    let pName = p.promoted ? PIECE_TYPES[p.t].pName : PIECE_TYPES[p.t].name;
                    
                    // 👍 CPU（2P）のメガ粒子砲が1Pに命中した時のプラス学習！
                    if (actor.p === 2 && p.p === 1) {
                        let bonusVal = (PIECE_VALUES[p.t] || 200) + 200; // メガ粒子砲成功は大ボーナス！
                        learnSuccessPattern(actor.t, tr, tc, bonusVal, "mega_beam");
                    }

                    if (p.hp <= 0) {
                        let capType = (p.t === 'SOLDIER' || p.t === 'SHOGUN') ? 'KI' : p.t;
                        
                        if (p.p === actor.p) {
                            // 💥 味方を誤射で撃破した場合：激怒して相手の持ち駒へ！
                            let enemyPlayer = actor.p === 1 ? 2 : 1;
                            captured[enemyPlayer].push(capType);
                            if (p.mountedPiece) captured[enemyPlayer].push(p.mountedPiece);
                            addLog(actor.p, `⚠️ 誤射！味方の${pName}がメガ粒子砲に巻き込まれて消滅！敵の持ち駒になった！`);
                        } else {
                            // ⚔️ 敵を撃破した場合
                            captured[actor.p].push(capType);
                            if (p.mountedPiece) captured[actor.p].push(p.mountedPiece);
                            addLog(actor.p, `メガ粒子砲！${pName}を貫通撃破！`);
                        }
                        boardState[tr][tc] = null;
                    } else {
                        addLog(actor.p, `メガ粒子砲！${pName}に1ダメージ！`);
                    }
                }
            }
        }
    });
    
    renderBoard();
    addLog(actor.p, `💥 充填完了！メガ粒子全貫通マップ兵器が自動掃射された！`);
}

function executeSpecial(actor, tr, tc) {
    const actorName = actor.promoted ? PIECE_TYPES[actor.t].pName : PIECE_TYPES[actor.t].name;

    if (actor.t === 'FU') {
        actor.spUsed = true;
        const targetPiece = boardState[tr] ? boardState[tr][tc] : null;
        if (!targetPiece) return;
        const targetName = targetPiece.promoted ? PIECE_TYPES[targetPiece.t].pName : PIECE_TYPES[targetPiece.t].name;

        if (targetPiece.shield > 0) {
            playSE('miss');
            addLog(turn, `ダブルバースト発動！${targetName}のシールドに遮られた！`);
            let infoEl = document.getElementById('info-panel');
            if (infoEl) infoEl.innerText = "🛡️ シールドによりダブルバーストが完全に防がれた！";
            setTimeout(endTurn, 300);
            return;
        }

        let hit1 = Math.random() < 0.5;
        if (hit1) {
            playLaserEffect(selected.r, selected.c, tr, tc); playHitEffect(tr, tc); playSE('hit');
            if (targetPiece.p === 2) learnFromCapture(targetPiece, tr, tc, actor);
            targetPiece.hp -= 1;
            addLog(turn, `【と】ダブルバースト 1打目：HIT！（1ダメ）`);
        } else {
            playMissEffect(tr, tc); playSE('miss');
            addLog(turn, `【と】ダブルバースト 1打目：MISS！`);
        }
        renderBoard();

        setTimeout(() => {
            if (targetPiece.hp > 0) {
                let hit2 = Math.random() < 0.5;
                if (hit2) {
                    playLaserEffect(selected.r, selected.c, tr, tc); playHitEffect(tr, tc); playSE('hit');
                    if (targetPiece.p === 2) learnFromCapture(targetPiece, tr, tc, actor);
                    targetPiece.hp -= 1;
                    addLog(turn, `【と】ダブルバースト 2打目：HIT！（1ダメ）`);
                } else {
                    playMissEffect(tr, tc); playSE('miss');
                    addLog(turn, `【と】ダブルバースト 2打目：MISS！`);
                }
            }

            if (targetPiece.hp <= 0) {
                if (checkGameOver(targetPiece)) return;
                addLog(turn, `ダブルバーストで${targetName}を遠距離撃破！`);
                let capType = (targetPiece.t === 'SOLDIER' || targetPiece.t === 'SHOGUN') ? 'KI' : targetPiece.t;
                captured[actor.p].push(capType);
                if (targetPiece.mountedPiece) captured[actor.p].push(targetPiece.mountedPiece);
                boardState[tr][tc] = null;
            }
            renderBoard();
            setTimeout(endTurn, 300);
        }, 500);

        return;
    } 
    else if (actor.t === 'KY') {
        actor.spUsed = true;
        playSE('select');
        let fromR = selected.r, fromC = selected.c;
        animatePieceMove(fromR, fromC, tr, tc, false, () => {
            boardState[tr][tc] = actor; boardState[fromR][fromC] = null;
            lastMoveTo = { r: tr, c: tc };
            playHitEffect(tr, tc);
            checkPickupItem(tr, tc, actor); checkPromotion(fromR, tr, actor);
            addLog(turn, `${actorName}の${PIECE_TYPES.KY.spName}！後方へ緊急移動！`);
            let infoEl = document.getElementById('info-panel');
            if (infoEl) infoEl.innerText = `【${PIECE_TYPES.KY.spName}】後方ブースト移動完了！`;
            setTimeout(endTurn, 300);
        });
    }
    else if (actor.t === 'KE' || actor.t === 'GI') {
        actor.spUsed = true;
        playLaserEffect(selected.r, selected.c, tr, tc, true);
        playHitEffect(tr, tc); playSE('heavy_hit');
        executeAttack(actor, tr, tc, true);
        setTimeout(endTurn, 300);
    }
    else if (actor.t === 'SHOGUN') {
        actor.spUsed = true;
        playHitEffect(selected.r, selected.c); playSE('heavy_hit');
        for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
                if (dr === 0 && dc === 0) continue;
                let trArr = selected.r + dr, tcArr = selected.c + dc;
                if (trArr >= 0 && trArr < 9 && tcArr >= 0 && tcArr < 9) {
                    let p = boardState[trArr] ? boardState[trArr][tcArr] : null;
                    if (p && p.p === 1) {
                        if (p.shield > 0) addLog(turn, `プチバースト！${PIECE_TYPES[p.t].name}のシールドに防がれた！`);
                        else {
                            playHitEffect(trArr, tcArr);
                            p.hp -= 1;
                            if (p.hp <= 0) boardState[trArr][tcArr] = null;
                        }
                    }
                }
            }
        }
        addLog(turn, `将軍の【プチバースト】！近接範囲を破砕！`);
        let infoEl = document.getElementById('info-panel');
        if (infoEl) infoEl.innerText = `将軍の『プチバースト』発動！周囲1マスの敵にダメージ！`;
        setTimeout(endTurn, 300);
    }
    else if (actor.t === 'KI') {
        actor.spUsed = true;
        if (selectedSpecialType === 'spear') {
            playSaberSlashEffect(tr, tc); playHitEffect(tr, tc); playSE('heavy_hit');
            executeAttack(actor, tr, tc, true, false, true); 
            setTimeout(endTurn, 300);
        } else {
            playSE('special');
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    let trArr = selected.r + dr, tcArr = selected.c + dc;
                    if (trArr >= 0 && trArr < 9 && tcArr >= 0 && tcArr < 9) {
                        let p = boardState[trArr] ? boardState[trArr][tcArr] : null;
                        if (p && p.p === actor.p) { p.shield = 3; playHitEffect(trArr, tcArr); }
                    }
                }
            }
            addLog(turn, `${actorName}のアルティメットシールド！全味方に3ターンバリア展開！`);
            let infoEl = document.getElementById('info-panel');
            if (infoEl) infoEl.innerText = `【アルティメットシールド】全方位バリアシールド展開！（3ターン）`;
            setTimeout(endTurn, 300);
        }
    }
    else if (actor.t === 'SOLDIER') {
        actor.spUsed = true;
        playSE('special');
        for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
                let trArr = selected.r + dr, tcArr = selected.c + dc;
                if (trArr >= 0 && trArr < 9 && tcArr >= 0 && tcArr < 9) {
                    let p = boardState[trArr] ? boardState[trArr][tcArr] : null;
                    if (p && p.p === actor.p) { p.shield = 3; playHitEffect(trArr, tcArr); }
                }
            }
        }
        addLog(turn, `${actorName}の${PIECE_TYPES[actor.t].spName}！全味方に3ターンバリア展開！`);
        let infoEl = document.getElementById('info-panel');
        if (infoEl) infoEl.innerText = `【${PIECE_TYPES[actor.t].spName}】全方位バリアシールド展開！（3ターン）`;
        setTimeout(endTurn, 300);
    }
    else if (actor.t === 'HI') {
        // 🐉 1ターンチャージ仕様！
        actor.spUsed = true;
        actor.isCharging = true;
        playSE('special');
        addLog(turn, `【メガ粒子砲】エネルギー充填開始！次ターン生存で全貫通発射！`);
        let infoEl = document.getElementById('info-panel');
        if (infoEl) infoEl.innerText = `⚡ メガ粒子砲チャージ開始！生き残れば次のターンで自動砲撃！`;
        setTimeout(endTurn, 300);
    }
    else if (actor.t === 'OU') {
        actor.spUsed = true;
        playSE('special');
        let emptyCells = [];
        for(let r=0; r<9; r++){
            for(let c=0; c<9; c++){
                if(!boardState[r][c]) emptyCells.push({r, c});
            }
        }
        if(emptyCells.length > 0) {
            let randCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            boardState[randCell.r][randCell.c] = actor; boardState[selected.r][selected.c] = null;
            lastMoveTo = { r: randCell.r, c: randCell.c };
            playHitEffect(randCell.r, randCell.c);
            checkPickupItem(randCell.r, randCell.c, actor);
            addLog(turn, `玉の${PIECE_TYPES.OU.spName}！緊急回避テレポート！`);
            let infoEl = document.getElementById('info-panel');
            if (infoEl) infoEl.innerText = `【${PIECE_TYPES.OU.spName}】次元跳躍発動！`;
        }
        setTimeout(endTurn, 300);
    }
}

function setMode(mode) {
    actionMode = mode; selectedCapIndex = null; isSpecialReady = false; isHorseDockingMode = false;
    let boardOverlay = document.getElementById('board-overlay');
    let spDescBox = document.getElementById('sp-desc-box');
    if (boardOverlay) boardOverlay.style.display = 'none';
    if (spDescBox) spDescBox.style.display = 'none';
    
    let btnAttack = document.getElementById('btn-attack');
    let spBtn = document.getElementById('btn-special');
    let spearBtn = document.getElementById('btn-spear');
    // 🎯 通常攻撃選択時の「テキスト変更」＆「黄色クラス付与」処理
    if (btnAttack) {
        if (mode === 'attack') {
            btnAttack.innerText = '🎯 目標選択';
            btnAttack.className = 'active-cmd'; // 黄色発光
        } else {
            btnAttack.innerText = '⚔️ 通常攻撃';
            btnAttack.className = '';
        }
    }

    if (spBtn) spBtn.className = 'sp-btn';
    if (spearBtn) spearBtn.className = 'sp-btn';

    calculateTargets(selected, actionMode);
    renderBoard();
}

function resetSelection() {
    selected = null; selectedCapIndex = null; actionMode = 'move'; isSpecialReady = false; isHorseDockingMode = false;
    targets = []; isProcessingTurn = false;
    
    let boardOverlay = document.getElementById('board-overlay');
    let spDescBox = document.getElementById('sp-desc-box');
    let btnAttack = document.getElementById('btn-attack');
    let spBtn = document.getElementById('btn-special');
    let spearBtn = document.getElementById('btn-spear');

    if (boardOverlay) boardOverlay.style.display = 'none';
    if (spDescBox) spDescBox.style.display = 'none';
    if (btnAttack) { 
    btnAttack.disabled = true; 
    btnAttack.innerText = '⚔️ 通常攻撃'; // 念のため元の文字に戻す
    btnAttack.className = ''; 
}
    if (spBtn) { spBtn.style.display = 'inline-block'; spBtn.disabled = true; spBtn.innerText = "🔥 必殺技未解放"; spBtn.className = 'sp-btn'; }
    if (spearBtn) spearBtn.style.display = 'none';
    
    renderBoard();

    const checkedKings = checkKingsUnderAttack();
    const isSelfChecked = checkedKings.some(pos => {
        let p = boardState[pos.r] ? boardState[pos.r][pos.c] : null;
        return p && p.p === turn;
    });

    if (isSelfChecked && isKingCheckmated(turn)) {
        let winnerStr = (turn === 1) ? ((gameMode === 'pve' || gameMode === 'boss') ? "CPU" : "2P") : "1P";
        alert(`⚠️ 王手詰み！【${turn === 1 ? '1P' : '2P'}】は完全に詰みました！\n🎉 【${winnerStr}】の勝利！`);
        initGame();
        return;
    }

    if (isSelfChecked && !lastCheckState) {
        lastCheckState = true;
        playCutinEffect("王手！", 'check');
    } else if (!isSelfChecked) lastCheckState = false;

    let pStr = ((gameMode === 'pve' || gameMode === 'boss') && turn === 2) ? 'CPU思考中...' : `${turn === 1 ? '1P（青）' : '2P（黄）'}のターンです。`;
    if (isSelfChecked) pStr = `⚠️【王手警報】玉（ボス）が狙われています！ガードまたは避難させてください！`;
    let infoEl = document.getElementById('info-panel');
    if (infoEl) infoEl.innerText = pStr;

// 🧠 CPUの自動思考発動ルール
    if (gameMode === 'cvc') {
        // 🤖 CPU vs CPUモード：1P・2P関係なく常に自動思考！
        setTimeout(playCPUTurn, 600);
    } else if ((gameMode === 'pve' || gameMode === 'boss') && turn === 2) {
        // ⚔️ 1P vs CPU / 大王戦：敵（2P）のターンの時だけ自動思考！
        setTimeout(playCPUTurn, 600);
    }
}

function endTurn() {
    isHorseDockingMode = false;
    let boardOverlay = document.getElementById('board-overlay');
    if (boardOverlay) boardOverlay.style.display = 'none';
    
    totalTurnsCount++;
    checkItemDrop();

    if (gameMode === 'boss' && turn === 2) {
        if (bossCoolDown > 0) bossCoolDown--;
    }

    for(let r=0; r<9; r++){
        for(let c=0; c<9; c++){
            let p = boardState[r] ? boardState[r][c] : null;
            if (p && p.p === turn) {
                if (p.shield > 0) p.shield--;
                
                // 🐎 馬の合体5手時限カウントダウン＆自動解除処理
                if (p.t === 'KA' && p.mountedPiece) {
                    p.dockTimer = (p.dockTimer !== undefined ? p.dockTimer : 5) - 1;
                    if (p.dockTimer <= 0) {
                        let ejectedPiece = p.mountedPiece;
                        p.mountedPiece = null;
                        
                        let emptySurroundings = [];
                        for (let dr = -1; dr <= 1; dr++) {
                            for (let dc = -1; dc <= 1; dc++) {
                                if (dr === 0 && dc === 0) continue;
                                let tr = r + dr, tc = c + dc;
                                if (tr >= 0 && tr < 9 && tc >= 0 && tc < 9 && !boardState[tr][tc]) {
                                    emptySurroundings.push({ r: tr, c: tc });
                                }
                            }
                        }
                        if (emptySurroundings.length > 0) {
                            let randPos = emptySurroundings[Math.floor(Math.random() * emptySurroundings.length)];
                            boardState[randPos.r][randPos.c] = {
                                t: ejectedPiece, p: p.p, hp: PIECE_TYPES[ejectedPiece].hp,
                                promoted: false, spUsed: false, shield: 0, mountedPiece: null, isCharging: false
                            };
                            addLog(p.p, `⚠️ 合体解除！馬から【${PIECE_TYPES[ejectedPiece].name}】が分離排出された！`);
                        } else {
                            captured[p.p].push(ejectedPiece);
                            addLog(p.p, `⚠️ 合体解除！【${PIECE_TYPES[ejectedPiece].name}】を持ち駒へ回収！`);
                        }
                    }
                }
            }
        }
    }

    turn = turn === 1 ? 2 : 1;

    // 🐉 龍のメガ粒子砲（チャージ完了時の自動発射 ➔ 1ターン消化してターン終了）
    let firedMegaBeam = false;
    for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
            let p = boardState[r] ? boardState[r][c] : null;
            if (p && p.p === turn && p.t === 'HI' && p.isCharging) {
                p.isCharging = false;
                firedMegaBeam = true;
                executeRyuMegaParticleBeam(r, c, p);
            }
        }
    }

    // 💥 メガ粒子砲を発射したターンは、攻撃終了後にそのまま即相手のターンへ移行！
    if (firedMegaBeam) {
        setTimeout(endTurn, 800);
        return;
    }

// 🏰 CPU（2P）のターンが終わった時に「囲い」が完成したかチェック！
    if (turn === 2 && typeof checkCpuCastleCompletion === 'function') {
        checkCpuCastleCompletion();
    }
    
    resetSelection();
}

// --- CPU AI（思考＆戦術選定システム） ---
function playCPUTurn() {
    let possibleActions = [];
// 🟡【NEW】現在ターンのプレイヤー（1Pか2Pか）を取得！
    let activeP = (gameMode === 'cvc') ? turn : 2;
    if (gameMode !== 'cvc' && turn === 1) return; // 🛡️ CvC以外で1Pターンの時はCPU思考を絶対実行しない！
    let enemyP = activeP === 1 ? 2 : 1;

    let checkedKings = checkKingsUnderAttack();
    let myKingChecked = checkedKings.some(pos => {
        let p = boardState[pos.r] ? boardState[pos.r][pos.c] : null;
        return p && p.p === activeP; // 👈 2 から activeP に変更
    });

// 😈 【VS大王戦：3体順番アクションシステム（分裂バグ防止＆滑らか演出版）】
    if (gameMode === 'boss') {
        let bossUnitTypes = ['SOLDIER', 'SHOGUN', 'BOSS'];
        
        (async () => {
            for (let unitType of bossUnitTypes) {
                // 盤上から該当する駒を探す
                let unitPos = null;
                for (let r = 0; r < 9; r++) {
                    for (let c = 0; c < 9; c++) {
                        let p = boardState[r] ? boardState[r][c] : null;
                        if (p && p.p === 2 && p.t === unitType) {
                            unitPos = { r, c, piece: p };
                            break;
                        }
                    }
                    if (unitPos) break;
                }

                if (!unitPos) continue; // その駒が倒されていれば次へ

                // 👑 大王のニアバースト判定
                if (unitType === 'BOSS' && bossCoolDown === 0) {
                    let countTargets = 0;
                    for (let dr = -2; dr <= 2; dr++) {
                        for (let dc = -2; dc <= 2; dc++) {
                            let tr = unitPos.r + dr, tc = unitPos.c + dc;
                            if (tr >= 0 && tr < 9 && tc >= 0 && tc < 9) {
                                let tp = boardState[tr] ? boardState[tr][tc] : null;
                                if (tp && tp.p === 1) countTargets++;
                            }
                        }
                    }
                    if (countTargets > 0) {
                        bossCoolDown = 4;
                        await new Promise(resolve => {
                            playCutinEffect("大王", 'normal', () => {
                                playHitEffect(unitPos.r, unitPos.c); playSE('heavy_hit');
                                for (let dr = -2; dr <= 2; dr++) {
                                    for (let dc = -2; dc <= 2; dc++) {
                                        let tr = unitPos.r + dr, tc = unitPos.c + dc;
                                        if (tr >= 0 && tr < 9 && tc >= 0 && tc < 9) {
                                            let tp = boardState[tr] ? boardState[tr][tc] : null;
                                            if (tp && tp.p === 1) {
                                                if (tp.shield > 0) addLog(2, `ニアバースト！${PIECE_TYPES[tp.t].name}のシールドに防がれた！`);
                                                else {
                                                    playHitEffect(tr, tc); tp.hp -= 1;
                                                    if (tp.hp <= 0) boardState[tr][tc] = null;
                                                }
                                            }
                                        }
                                    }
                                }
                                addLog(2, `😈大王の【ニアバースト】！周囲の敵をなぎ払った！`);
                                renderBoard();
                                setTimeout(resolve, 600);
                            });
                        });
                        continue;
                    }
                }

                // 🎯 最善手を選択
                let myActions = [];
                let atks = calculateTargetsPure({ r: unitPos.r, c: unitPos.c }, 'attack');
                atks.filter(t => !t.blocked).forEach(t => {
                    myActions.push({ type: 'attack', from: unitPos, to: t, score: evaluateActionMid(unitPos, t, 'attack') + 200 });
                });

                let mvs = calculateTargetsPure({ r: unitPos.r, c: unitPos.c }, 'move');
                mvs.filter(t => !t.blocked).forEach(t => {
                    myActions.push({ type: 'move', from: unitPos, to: t, score: evaluateActionMid(unitPos, t, 'move') });
                });

                if (myActions.length > 0) {
                    myActions.sort((a, b) => b.score - a.score);
                    let act = myActions[0];

                    if (act.type === 'attack') {
                        // ⚔️ 攻撃：アニメーション後になぎ払い＆移動（分裂防止）
                        await new Promise(resolve => {
                            let fromR = unitPos.r, fromC = unitPos.c;
                            let actor = unitPos.piece;

                            animatePieceMove(fromR, fromC, act.to.r, act.to.c, true, () => {
                                playSaberSlashEffect(act.to.r, act.to.c);
                                playHitEffect(act.to.r, act.to.c);
                                
                                // 攻撃処理
                                executeAttack(actor, act.to.r, act.to.c, false);
                                
                                // 🛑 【分裂防止】攻撃で前進・拿捕した場合は元のマスをしっかり消す！
                                if (boardState[act.to.r][act.to.c] === actor && (act.to.r !== fromR || act.to.c !== fromC)) {
                                    boardState[fromR][fromC] = null;
                                }

                                renderBoard();
                                setTimeout(resolve, 500);
                            });
                        });
                    } else if (act.type === 'move') {
                        // 🚶 移動：元のマスを消して移動先へ
                        await new Promise(resolve => {
                            playSE('select');
                            animatePieceMove(unitPos.r, unitPos.c, act.to.r, act.to.c, false, () => {
                                boardState[act.to.r][act.to.c] = unitPos.piece;
                                boardState[unitPos.r][unitPos.c] = null; // 元のマスを消す
                                checkPickupItem(act.to.r, act.to.c, unitPos.piece);
                                addLog(2, `👿ボス軍団【${PIECE_TYPES[unitType].name}】が進撃！`);
                                renderBoard();
                                setTimeout(resolve, 400);
                            });
                        });
                    }

                    // ⚠️ 王手警報ストッパー
                    let checkedKings = checkKingsUnderAttack();
                    if (checkedKings.some(pos => boardState[pos.r] && boardState[pos.r][pos.c] && boardState[pos.r][pos.c].p === 1)) {
                        addLog(2, `⚠️ ボス軍団の襲撃により王手発生！`);
                        break; 
                    }
                }
            }
            
            setTimeout(endTurn, 400);
        })();

        return;
    }

// 🛡️ 【持ち駒を打つ判定】
    if (captured[activeP].length > 0) {
        captured[activeP].forEach((pieceType, capIndex) => {
            let emptyCells = [];
            for(let r=0; r<9; r++){
                for(let c=0; c<9; c++){
                    if(!boardState[r][c]) {
                        if (pieceType === 'FU' && hasPawnInColumn(activeP, c)) {}
                        else if (isInvalidDropPosition(activeP, pieceType, r)) {}
                        else {
                            let score = PIECE_VALUES[pieceType] || 15;
                            let isShieldDrop = false; // 🛡️ 盾（合駒）として機能したかフラグ
                            
                            // 🛡️ 【新設】敵の大駒・香車の射線遮断（盾・合駒）チェック！
                            if (pieceType === 'FU') {
                                for (let er = 0; er < 9; er++) {
                                    for (let ec = 0; ec < 9; ec++) {
                                        let ep = boardState[er] ? boardState[er][ec] : null;
                                        // 敵(1P)の飛・龍・角・馬・香車を探す
                                        if (ep && ep.p === 1 && (ep.t === 'HI' || ep.t === 'KA' || ep.t === 'KY' || ep.promoted)) {
                                            let enemyAtkTargets = calculateTargetsPure({ r: er, c: ec }, 'attack');
                                            let isOnRay = enemyAtkTargets.some(t => t.r === r && t.c === c);
                                            
                                            if (isOnRay) {
                                                // 仮に歩を置いた場合、敵の射線が止まるかをシミュレーション
                                                boardState[r][c] = { t: 'FU', p: 2 };
                                                let targetsAfterDrop = calculateTargetsPure({ r: er, c: ec }, 'attack');
                                                boardState[r][c] = null;

                                                let savedFriend = false;
                                                enemyAtkTargets.forEach(t => {
                                                    let friend = boardState[t.r] ? boardState[t.r][t.c] : null;
                                                    if (friend && friend.p === 2 && friend.t !== 'FU') {
                                                        if (!targetsAfterDrop.some(at => at.r === t.r && at.c === t.c)) {
                                                            savedFriend = true;
                                                        }
                                                    }
                                                });

                                                if (savedFriend) {
                                                    score += 500; // 🛡️ 完璧な盾になる位置に特大加点！
                                                    isShieldDrop = true;
                                                }
                                            }
                                        }
                                    }
                                }
                                
                                // 🚫 盾にもならず王手も受けていない時の「無意味な歩の無駄打ち」を減点！
                                if (!isShieldDrop && !myKingChecked) {
                                    score -= 300; 
                                }
                            }

                            // 🛡️ 敵の長距離砲ラインチェック
                            let enemyPenetratingCount = getPenetratingCoverCount(r, c, 1);
                            if (enemyPenetratingCount > 0) {
                                let myDefendCount = getTileCoverCount(r, c, 2);
                                if (myDefendCount === 0) {
                                    score += 200;
                                }
                            }

                            score += PSTO_MID[r][c] * 2;

                            // 🎯【追加】自分の利き（角や桂馬のサポート）があるマスへの打ち込みを大加点！
                            let myCovers = getTileCoverCount(r, c, 2); 
                            if (myCovers > 0) {
                                score += myCovers * 300; // 利きが重なるマス（1三など）に爆発的な加点！
                            }

                            if (myKingChecked) {
                                boardState[r][c] = { t: pieceType, p: activeP, hp: 1 };
                                let stillChecked = checkKingsUnderAttack().some(pos => {
                                    let k = boardState[pos.r][pos.c]; return k && k.p === activeP;
                                });
                                boardState[r][c] = null;
                                if (stillChecked) return;
                            }
                            emptyCells.push({cell: {r, c}, score});
                        }
                    }
                }
            }
            if (emptyCells.length > 0) {
                emptyCells.sort((a, b) => b.score - a.score);
                possibleActions.push({ type: 'drop', capIndex: capIndex, to: emptyCells[0].cell, score: emptyCells[0].score });
            }
        });
    }

    for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
            let p = boardState[r] ? boardState[r][c] : null;
            if (p && p.p === activeP) {
                let origin = { r, c };
                let canSp = false;
                if (p.t === 'KI' || p.t === 'SOLDIER' || p.t === 'SHOGUN') canSp = !p.spUsed;
                else if (p.t === 'OU') canSp = !p.spUsed; 
                else if (p.t === 'HI') canSp = (p.promoted && !p.spUsed); // 🐉 CPUも龍のみ必殺判定
                else if (p.t === 'KA') canSp = (p.promoted && !p.spUsed && captured[2].length > 0);
                else canSp = (p.promoted && !p.spUsed);

                if (canSp) {
                    if (p.t === 'KA' && captured[2].length > 0) {
                        let score = 500;
                        if (!myKingChecked) possibleActions.push({ type: 'horse_dock', from: origin, capIndex: 0, score: score });
                    } else if (p.t === 'KI') {
                        if (shouldCpuUseShield(r, c) && !myKingChecked) {
                            possibleActions.push({ type: 'special', from: origin, to: origin, spType: 'shield', score: 500 });
                        }
                        selectedSpecialType = 'spear';
                        let spearTargets = calculateTargetsPure(origin, 'special');
                        spearTargets.filter(t => !t.blocked).forEach(t => {
                            let score = evaluateActionMid(origin, t, 'special') + 300;
                            if (myKingChecked) {
                                let savedP = boardState[r][c], savedT = boardState[t.r][t.c];
                                boardState[t.r][t.c] = savedP; boardState[r][c] = null;
                                let stillChecked = checkKingsUnderAttack().some(pos => {
                                    let k = boardState[pos.r][pos.c]; return k && k.p === 2;
                                });
                                boardState[r][c] = savedP; boardState[t.r][t.c] = savedT;
                                if (stillChecked) return;
                            }
                            possibleActions.push({ type: 'special', from: origin, to: t, spType: 'spear', score: score });
                        });
                        selectedSpecialType = 'shield';

                        // 🟡【NEW】王(OU)のワープは「王手されている時だけ」使うように制御！
                    } else if (p.t === 'OU') {
                        if (myKingChecked) {
                            possibleActions.push({ type: 'special', from: origin, to: origin, score: 2000 });
                        }

                    } else if (p.t !== 'BOSS') {
                        let spTargets = calculateTargetsPure(origin, 'special');
                        spTargets.filter(t => !t.blocked).forEach(t => {
                            let score = evaluateActionMid(origin, t, 'special') + 200;
                            if (myKingChecked) {
                                let savedP = boardState[r][c], savedT = boardState[t.r][t.c];
                                boardState[t.r][t.c] = savedP; boardState[r][c] = null;
                                let stillChecked = checkKingsUnderAttack().some(pos => {
                                    let k = boardState[pos.r][pos.c]; return k && k.p === 2;
                                });
                                boardState[r][c] = savedP; boardState[t.r][t.c] = savedT;
                                if (stillChecked) return;
                            }
                            possibleActions.push({ type: 'special', from: origin, to: t, spType: 'shield', score: score });
                        });
                    }
                }

                let atkTargets = calculateTargetsPure(origin, 'attack');
                atkTargets.filter(t => !t.blocked).forEach(t => {
                    let score = evaluateActionMid(origin, t, 'attack');
                    if (p.t === 'BOSS') score += 150;
                    if (myKingChecked) {
                        let savedP = boardState[r][c], savedT = boardState[t.r][t.c];
                        boardState[t.r][t.c] = savedP; boardState[r][c] = null;
                        let stillChecked = checkKingsUnderAttack().some(pos => {
                            let k = boardState[pos.r][pos.c]; return k && k.p === 2;
                        });
                        boardState[r][c] = savedP; boardState[t.r][t.c] = savedT;
                        if (stillChecked) return;
                    }
                    possibleActions.push({ type: 'attack', from: origin, to: t, score: score });
                });

                let moveTargets = calculateTargetsPure(origin, 'move');
                moveTargets.filter(t => !t.blocked).forEach(t => {
                    let score = evaluateActionMid(origin, t, 'move');
                    if (isEnemyThreatening(r, c) && !isEnemyThreatening(t.r, t.c)) score += 60; 
                    if (itemState.some(it => it.r === t.r && it.c === t.c)) score += 70;

                    if (myKingChecked) {
                        let savedP = boardState[r][c], savedT = boardState[t.r][t.c];
                        boardState[t.r][t.c] = savedP; boardState[r][c] = null;
                        let stillChecked = checkKingsUnderAttack().some(pos => {
                            let k = boardState[pos.r][pos.c]; return k && k.p === 2;
                        });
                        boardState[r][c] = savedP; boardState[t.r][t.c] = savedT;
                        if (stillChecked) return;
                    }
                    possibleActions.push({ type: 'move', from: origin, to: t, score: score });
                });
            }
        }
    }

    if (possibleActions.length === 0) { endTurn(); return; }

    // 🎯 【最優先ルール0：序盤の絶対定跡・飛車先防衛（75%の確率で発動）】
    let isPlayerPawnAt25 = boardState[4] && boardState[4][7] && boardState[4][7].p === 1 && boardState[4][7].t === 'FU';
    let is32Empty = boardState[1] && !boardState[1][6]; 
    let myGinAt31 = boardState[0] && boardState[0][6] && boardState[0][6].p === 2 && boardState[0][6].t === 'GI'; 

    let openingDefendMove = null;
    if (isPlayerPawnAt25 && is32Empty && myGinAt31) {
        if (Math.random() < 0.75) { 
            openingDefendMove = possibleActions.find(act => 
                act.type === 'move' && 
                act.from.r === 0 && act.from.c === 6 && 
                act.to.r === 1 && act.to.c === 6
            );
            if (openingDefendMove) {
                addLog(2, "💡 定跡対応(75%)：飛車先プレッシャーを検知！【3二銀】で角頭をガード！");
            }
        } else {
            addLog(2, "🤔 CPU：飛車先を警戒しつつも、別構えを選択…");
        }
    }

    // 🎯 【第1段階：最優先戦術ルール（緊急対処フィルター）】
    let urgentInterceptions = possibleActions.filter(action => {
        if (action.type === 'attack') {
            let target = boardState[action.to.r] ? boardState[action.to.r][action.to.c] : null;
            if (target && target.p === 1 && (action.to.r <= 3 || target.promoted)) {
                return true; 
            }
        }
        return false;
    });

    if (urgentInterceptions.length === 0 && openingDefendMove) {
        urgentInterceptions = [openingDefendMove];
    }

    let best = null;

    if (urgentInterceptions.length > 0) {
        urgentInterceptions.sort((a, b) => b.score - a.score);
        best = urgentInterceptions[0];
    } else {
        possibleActions.sort((a, b) => b.score - a.score);
        best = possibleActions[0];
    }

    if (best.from && boardState[best.from.r] && boardState[best.from.r][best.from.c]) {
        let key = `${best.to.r},${best.to.c}_${boardState[best.from.r][best.from.c].t}`;
        cpuPreviousPosMap[key] = { r: best.from.r, c: best.from.c };
    }

    isProcessingTurn = true;

if (best.type === 'drop') {
        let pieceType = captured[activeP].splice(best.capIndex, 1)[0];
        boardState[best.to.r][best.to.c] = { t: pieceType, p: activeP, hp: PIECE_TYPES[pieceType].hp, promoted: false, spUsed: false, shield: 0, mountedPiece: null, isCharging: false };
        lastMoveTo = { r: best.to.r, c: best.to.c };
        playSE('select');
        addLog(2, `CPUが持ち駒【${PIECE_TYPES[pieceType].name}】を召喚！`);
        let infoEl = document.getElementById('info-panel');
        if (infoEl) infoEl.innerText = `CPUが持ち駒【${PIECE_TYPES[pieceType].name}】を召喚！`;
        setTimeout(endTurn, 400);
    } else if (best.type === 'horse_dock') {
        let actor = boardState[best.from.r][best.from.c];
        let capType = captured[2].splice(best.capIndex, 1)[0];
        actor.mountedPiece = capType; actor.spUsed = true; actor.dockTimer = 5;
        lastMoveTo = { r: best.from.r, c: best.from.c };
        
        playCutinEffect(PIECE_TYPES[actor.t].spName, 'normal', () => {
            playHitEffect(best.from.r, best.from.c); playSE('special');
            addLog(2, `CPUの馬が【${PIECE_TYPES[capType].name}】と合体！(残り5手)`);
            let infoEl = document.getElementById('info-panel');
            if (infoEl) infoEl.innerText = `CPUの馬が合体しました！`;
            isProcessingTurn = false; isHorseDockingMode = false;
            setTimeout(endTurn, 400);
        });
    } else {
        let actor = boardState[best.from.r][best.from.c];
        if (best.type === 'move') {
            playSE('select');
            let fromR = best.from.r, fromC = best.from.c;
            lastMoveTo = { r: best.to.r, c: best.to.c };
            const actorName = actor.promoted ? PIECE_TYPES[actor.t].pName : PIECE_TYPES[actor.t].name;
            
            animatePieceMove(fromR, fromC, best.to.r, best.to.c, false, () => {
                boardState[best.to.r][best.to.c] = actor; boardState[fromR][fromC] = null;
                checkPickupItem(best.to.r, best.to.c, actor);
                let pMsg = checkPromotion(fromR, best.to.r, actor);
                addLog(2, `${actorName}が移動。${pMsg}`);
                endTurn();
            });
        } else if (best.type === 'attack') {
            selected = best.from;
            let targetObj = calculateTargetsPure(best.from, 'attack').find(t => t.r === best.to.r && t.c === best.to.c);
            let targetPiece = boardState[best.to.r] ? boardState[best.to.r][best.to.c] : null;
            let willCapture = (targetPiece && targetPiece.hp <= ((actor.mountedPiece && targetObj && targetObj.isHeavy) ? 2 : 1));
            let dist = Math.max(Math.abs(best.to.r - best.from.r), Math.abs(best.to.c - best.from.c));
            let isRangedAttack = (dist >= 2 && (actor.t === 'HI' || actor.t === 'KA' || actor.t === 'KY'));

            if (willCapture) {
                animatePieceMove(best.from.r, best.from.c, best.to.r, best.to.c, true, () => {
                    playSaberSlashEffect(best.to.r, best.to.c);
                    playHitEffect(best.to.r, best.to.c);
                    executeAttack(actor, best.to.r, best.to.c, false, targetObj ? targetObj.isHeavy : false);
                    setTimeout(endTurn, 400);
                });
            } else {
                if (isRangedAttack) {
                    playLaserEffect(best.from.r, best.from.c, best.to.r, best.to.c, targetObj ? targetObj.isHeavy : false);
                    if (targetObj && targetObj.isHeavy && actor.mountedPiece) playSE('heavy_hit'); else playSE('hit');
                    playHitEffect(best.to.r, best.to.c);
                    executeAttack(actor, best.to.r, best.to.c, false, targetObj ? targetObj.isHeavy : false);
                    setTimeout(endTurn, 400);
                } else {
                    playSaberSlashEffect(best.to.r, best.to.c);
                    playHitEffect(best.to.r, best.to.c);
                    if (targetObj && targetObj.isHeavy) playSE('heavy_hit'); else playSE('hit');
                    executeAttack(actor, best.to.r, best.to.c, false, targetObj ? targetObj.isHeavy : false);
                    setTimeout(endTurn, 400);
                }
            }
        } else if (best.type === 'special') {
            selected = best.from; selectedSpecialType = best.spType || 'shield';
            let spNameStr = (actor.t === 'KI' && selectedSpecialType === 'spear') ? PIECE_TYPES.KI.spName2 : PIECE_TYPES[actor.t].spName;

            playCutinEffect(spNameStr, 'normal', () => {
                playHitEffect(best.to.r, best.to.c);
                playSE('special');
                executeSpecial(actor, best.to.r, best.to.c);
            });
        }
    }
}

function getTargetsFor(origin, mode) {
    selected = origin; calculateTargets(origin, mode); return targets;
}

window.onload = function() { initGame(); };
</script>
